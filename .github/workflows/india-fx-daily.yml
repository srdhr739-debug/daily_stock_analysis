name: India & Forex Daily

# 印度股市 + 外汇每日看板：抓取 Yahoo Finance 数据，生成手机网页并发布到 gh-pages 的 /india/。
# 启用方式见 docs/india-fx-tracker.md（需 Repository variable INDIA_FX_ENABLED=true）。
on:
  schedule:
    - cron: '20 11 * * 1-5'   # UTC 11:20 = IST 16:50（NSE 15:30 收盘后）
  workflow_dispatch:
    inputs:
      force:
        description: '即使当天报告已存在也重新生成'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: vars.INDIA_FX_ENABLED == 'true'
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 获取现有网站（gh-pages）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$remote" site
          else
            git init -b gh-pages site
            git -C site remote add origin "$remote"
          fi

      - name: 生成看板
        env:
          INDIA_FX_INDICES: ${{ vars.INDIA_FX_INDICES }}
          INDIA_FX_STOCKS: ${{ vars.INDIA_FX_STOCKS }}
          INDIA_FX_PAIRS: ${{ vars.INDIA_FX_PAIRS }}
          INDIA_FX_AI_ENABLED: ${{ vars.INDIA_FX_AI_ENABLED }}
          INDIA_FX_REPORT_LANGUAGE: ${{ vars.INDIA_FX_REPORT_LANGUAGE }}
          INDIA_FX_KEEP_DAYS: ${{ vars.INDIA_FX_KEEP_DAYS }}
          # AI 简报复用项目的 LLM 配置（任选其一；都不配置时使用规则摘要）
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || secrets.ANTHROPIC_MODEL }}
          AIHUBMIX_KEY: ${{ secrets.AIHUBMIX_KEY }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL || secrets.LITELLM_MODEL }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        run: |
          args="--site site"
          if [ "${{ inputs.force }}" = "true" ]; then args="$args --force"; fi
          python -m src.india_fx_tracker $args

      - name: 推送到 gh-pages
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "网站无变化，跳过推送"
            exit 0
          fi
          git commit -m "Update India & Forex dashboard $(date -u +%Y-%m-%d)"
          git push origin gh-pages
